name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: python -m compileall -q app scripts
      - run: python -m pytest -q
      - run: python -m scripts.evaluate
      - run: docker build -t enterprise-ai-model-router:ci .

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.6'
      - run: sh tests/infrastructure/test_terraform.sh
