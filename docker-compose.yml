services:
  router:
    build:
      context: .
      args:
        INSTALL_PROVIDERS: ${INSTALL_PROVIDERS:-false}
    environment:
      ROUTER_MODELS_CONFIG: ${ROUTER_MODELS_CONFIG:-/app/configs/models.yaml}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.163.2
    profiles: ["tracing"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployment/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
